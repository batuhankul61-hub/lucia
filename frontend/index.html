  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<body>
  <main id="view" class="view"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Zm-7 9a7 7 0 0 0 14 0M12 19v3"/></svg>Practice</a>

  <dialog id="code-dialog">
    <form method="dialog">
      <h2>Access code</h2>
      <p class="muted">This demo is protected so its free AI quota isn't used up. Enter the code you were given.</p>
      <input name="code" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Access code">
      <div class="row">
        <button class="btn ghost" value="cancel">Cancel</button>
        <button class="btn primary" value="ok">Continue</button>
      </div>
    </form>
  </dialog>
</body>
